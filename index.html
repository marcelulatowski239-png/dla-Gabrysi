<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Dla Gabrysi ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050008;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background: radial-gradient(circle at center, #210016 0%, #0b000d 42%, #020003 100%);
}

/* Delikatna poświata w tle */
body::before {
    content: "";
    position: absolute;
    width: 80vw;
    height: 80vw;
    max-width: 650px;
    max-height: 650px;
    border-radius: 50%;
    background: rgba(255, 25, 110, 0.10);
    filter: blur(80px);
    animation: backgroundPulse 4s ease-in-out infinite;
}

@keyframes backgroundPulse {
    0%, 100% {
        transform: scale(.85);
        opacity: .5;
    }
    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

/* Nagłówek u góry */
.topHeader {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: clamp(20px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: .5px;
    z-index: 10;
    text-shadow: 0 0 10px rgba(255, 79, 145, 0.6);
    opacity: 0;
    animation: topAppear 1.5s .5s forwards;
}

@keyframes topAppear {
    to {
        opacity: 1;
    }
}

/* Główna scena */
.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Serce */
.heart {
    position: absolute;
    width: min(92vw, 620px);
    height: min(82vh, 600px);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* Pojedyncze napisy budujące kształt */
.word {
    position: absolute;
    color: #ff7eae;
    font-size: clamp(8px, 1.7vw, 13px);
    font-weight: 600;
    letter-spacing: .3px;
    white-space: nowrap;
    text-shadow:
        0 0 4px #ff397f,
        0 0 10px rgba(255, 35, 110, .9),
        0 0 20px rgba(255, 20, 100, .5);

    opacity: 0;
    transform: translate(-50%, -50%) scale(.2);
    animation:
        appear 1.5s cubic-bezier(.17,.89,.32,1.28) forwards,
        float 3s ease-in-out infinite;
}

@keyframes appear {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.1) rotate(-10deg);
        filter: blur(5px);
    }
    65% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15) rotate(2deg);
        filter: blur(0);
    }
    100% {
        opacity: .85;
        transform: translate(-50%, -50%) scale(1) rotate(0);
        filter: blur(0);
    }
}

@keyframes float {
    0%, 100% {
        margin-top: 0;
    }
    50% {
        margin-top: -3px;
    }
}

/* Główny napis na środku */
.centerText {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.5);
    width: 85%;
    max-width: 450px;

    color: white;
    font-size: clamp(14px, 3.8vw, 24px);
    font-weight: 700;
    text-align: center;
    line-height: 1.4;

    opacity: 0;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff4f91,
        0 0 35px #ff176d,
        0 0 70px rgba(255, 20, 100, .8);

    animation: centerAppear 2s 4.2s cubic-bezier(.17,.89,.32,1.28) forwards;
}

@keyframes centerAppear {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.5);
        filter: blur(12px);
    }
    70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
        filter: blur(0);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
    }
}

/* Małe serduszka w tle */
.love {
    position: absolute;
    color: #ff4c91;
    font-size: 14px;
    pointer-events: none;
    text-shadow: 0 0 8px #ff176d, 0 0 18px #ff176d;
    animation: rise linear forwards;
}

@keyframes rise {
    0% {
        opacity: 0;
        transform: translateY(20px) scale(.3) rotate(0deg);
    }
    15% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform: translateY(-110vh) scale(1.2) rotate(180deg);
    }
}

/* Podpowiedź na dole */
.hint {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.55);
    font-size: 12px;
    letter-spacing: 1px;
    animation: hintPulse 2s ease-in-out infinite;
}

@keyframes hintPulse {
    0%, 100% {
        opacity: .35;
    }
    50% {
        opacity: .8;
    }
}

/* Efekt błysku */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    pointer-events: none;
    opacity: 0;
    z-index: 100;
}

.flash.active {
    animation: flash .7s ease-out;
}

@keyframes flash {
    0% {
        opacity: .5;
    }
    100% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="topHeader">dla-Gabrysi</div>

<div class="scene">
    <div class="heart" id="heart"></div>
    <div class="centerText">Jesteś dla mnie najlepszą przyjaciółką i osobą jaką poznałem w życiu ❤️</div>
    <div class="hint">dotknij ekranu ✨</div>
</div>

<div class="flash" id="flash"></div>

<script>
const heart = document.getElementById("heart");
const flash = document.getElementById("flash");
const TEXT = "Uwielbiam Cię";
const COUNT = 260;

function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x, y };
}

for (let i = 0; i < COUNT; i++) {
    const t = (Math.PI * 2 / COUNT) * i;
    const point = heartPoint(t);
    const scale = Math.min(heart.clientWidth / 36, heart.clientHeight / 31);
    const x = heart.clientWidth / 2 + point.x * scale;
    const y = heart.clientHeight / 2 - point.y * scale;

    const span = document.createElement("span");
    span.className = "word";
    span.textContent = TEXT;
    span.style.left = x + "px";
    span.style.top = y + "px";

    const delay = 0.3 + i * 0.014 + Math.random() * 0.5;
    span.style.animationDelay = delay + "s, " + (delay + 1.5) + "s";

    const size = 0.75 + Math.random() * .45;
    span.style.fontSize = `clamp(7px, ${1.4 * size}vw, ${12 * size}px)`;

    heart.appendChild(span);
}

function createLove() {
    const love = document.createElement("div");
    love.className = "love";
    const symbols = ["♥", "♡", "❤", "💕", "✨"];
    love.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    love.style.left = Math.random() * 100 + "vw";
    love.style.bottom = "-30px";
    love.style.fontSize = (8 + Math.random() * 18) + "px";

    const duration = 4 + Math.random() * 5;
    love.style.animationDuration = duration + "s";

    document.body.appendChild(love);
    setTimeout(() => { love.remove(); }, duration * 1000);
}

setInterval(createLove, 280);

function burst(x, y) {
    flash.classList.remove("active");
    void flash.offsetWidth;
    flash.classList.add("active");

    for (let i = 0; i < 30; i++) {
        const love = document.createElement("div");
        love.className = "love";
        love.textContent = Math.random() > .5 ? "♥" : "✨";
        love.style.left = x + "px";
        love.style.top = y + "px";
        love.style.position = "fixed";

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 220;
        const targetX = Math.cos(angle) * distance;
        const targetY = Math.sin(angle) * distance;

        love.animate([
            { transform: "translate(-50%, -50%) scale(.2)", opacity: 1 },
            { transform: `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(1.4)`, opacity: 0 }
        ], {
            duration: 900 + Math.random() * 700,
            easing: "cubic-bezier(.17,.89,.32,1.28)"
        });

        document.body.appendChild(love);
        setTimeout(() => { love.remove(); }, 1700);
    }
}

document.addEventListener("click", (e) => { burst(e.clientX, e.clientY); });
document.addEventListener("touchstart", (e) => {
    if (e.touches.length > 0) {
        burst(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

setTimeout(() => {
    for (let i = 0; i < 12; i++) {
        setTimeout(() => { createLove(); }, i * 180);
    }
}, 1000);
</script>

</body>
</html>
